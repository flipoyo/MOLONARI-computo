# Environment of the whole MOLONARI-computo tree. It installs the three packages of the tree in editable mode from
# the repositories cgitsync places next to this file, so that a change in one of them is seen at once by the
# others, by the tests and by the tutorials. Each repository also has a pixi.toml of its own, to be used on its own.
[workspace]
name = "molonari-computo"
version = "1.0.1"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = "*"
pandas = "*"
scipy = "*"
matplotlib = "*"
numba = ">=0.60"
tqdm = "*"
psutil = "*"
protobuf = "*"
paho-mqtt = ">=2"
pytest = "*"
nbmake = "*"
jupyterlab = "*"
ipykernel = "*"
setuptools = "*"

[pypi-dependencies]
pyheatmy = { path = "MOLO-pyheatmy", editable = true }
bayesian_inversion = { path = "MOLO-bayesian", editable = true }
molonari-pipeline = { path = "MOLO-data-process", editable = true }

[tasks]
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
test-pyheatmy = { cmd = "pytest tests", cwd = "MOLO-pyheatmy" }
test-bayesian = { cmd = "pytest tests", cwd = "MOLO-bayesian" }
test-data-process = { cmd = "python -m unittest discover -s tests -t .", cwd = "MOLO-data-process" }
# the tests that use pyheatmy and bayesian_inversion together, with their own copy of the Point034 data
test-shared = { cmd = "pytest", cwd = "integration_tests" }
test-all = { depends-on = ["test-pyheatmy", "test-bayesian", "test-data-process", "test-shared"] }
# the two inversions run an MCMC of about four minutes each
test-tuto = { cmd = "pytest --nbmake 01_generate_data.ipynb 02_inversion.ipynb 03_real_data.ipynb", cwd = "MOLO-tuto-cmpt" }
lab = { cmd = "jupyter lab", cwd = "MOLO-tuto-cmpt" }
